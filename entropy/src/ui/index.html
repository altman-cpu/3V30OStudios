<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>ENTROPY · Genesis Unmask HUD</title>
    <meta name="description" content="Entropy Memory, Power Weaving, AR overlay, AI squad companions, missions, safe multiplayer and the Reality Mining stack." />
    <link rel="stylesheet" href="/ui/chromium.css" />
    <link rel="stylesheet" href="/ui/hud.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%233b82f6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%233b82f6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to console</a>

    <!-- ── top chrome: identity, authority, live state ─────────────────── -->
    <header class="topbar ent-glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34">
            <defs>
              <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="var(--accent)" />
                <stop offset="55%" stop-color="var(--accent-2)" />
                <stop offset="100%" stop-color="var(--accent-3)" />
              </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="17" fill="none" stroke="url(#bg-grad)" stroke-width="2" opacity="0.85" />
            <circle cx="20" cy="20" r="10" fill="none" stroke="url(#bg-grad)" stroke-width="1.2" opacity="0.55" />
            <circle cx="20" cy="20" r="3.4" fill="url(#bg-grad)" />
            <path d="M20 3v6M20 31v6M3 20h6M31 20h6" stroke="url(#bg-grad)" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>ENTROPY</strong>
          <em id="brand-sub">Genesis Unmask · booting…</em>
        </span>
      </div>

      <div class="authority" id="authority">
        <div class="auth-row">
          <span class="chip" id="auth-subject">anonymous</span>
          <span class="chip chip-tier" id="auth-tier">no token</span>
          <span class="chip chip-mono" id="auth-address" title="entropy address of this key">—</span>
        </div>
        <div class="smart">
          <div class="smart-head">
            <span>key auth token · smart value</span>
            <b id="auth-smart">0</b>
          </div>
          <div class="meter" role="img" aria-label="smart value meter">
            <span id="auth-smart-bar" style="width: 0%"></span>
          </div>
          <div class="smart-foot">
            <span id="auth-expiry">—</span>
            <span class="spacer"></span>
            <button class="btn btn-ghost btn-xs" id="btn-token" type="button">issue token</button>
            <button class="btn btn-ghost btn-xs" id="btn-refresh-token" type="button">refresh</button>
          </div>
        </div>
      </div>

      <div class="vitals">
        <div class="vital"><span>chain</span><b id="vital-height">—</b></div>
        <div class="vital"><span>difficulty</span><b id="vital-diff">—</b></div>
        <div class="vital"><span>pending</span><b id="vital-pending">—</b></div>
        <div class="vital"><span>rlu</span><b id="vital-rlu">—</b></div>
        <div class="vital vital-live"><span>stream</span><b id="vital-stream">off</b></div>
      </div>
    </header>

    <!-- ── navigation ──────────────────────────────────────────────────── -->
    <nav class="tabs" id="tabs" aria-label="Entropy systems">
      <button class="tab is-active" data-tab="overview" type="button">Overview</button>
      <button class="tab" data-tab="memory" type="button">Entropy Memory</button>
      <button class="tab" data-tab="weave" type="button">Power Weaving</button>
      <button class="tab" data-tab="ar" type="button">AR Overlay</button>
      <button class="tab" data-tab="squad" type="button">Squad AI</button>
      <button class="tab" data-tab="missions" type="button">Missions &amp; Seasons</button>
      <button class="tab" data-tab="multiplayer" type="button">Multiplayer</button>
      <button class="tab" data-tab="miners" type="button">Reality Miners</button>
      <button class="tab" data-tab="pending" type="button">Unmask Pool <em id="tab-pending-count"></em></button>
      <button class="tab" data-tab="handlers" type="button">Handlers &amp; API</button>
    </nav>

    <main id="main" class="stage">
      <section class="panel" id="panel-overview" data-panel="overview"></section>
      <section class="panel is-hidden" id="panel-memory" data-panel="memory"></section>
      <section class="panel is-hidden" id="panel-weave" data-panel="weave"></section>
      <section class="panel is-hidden" id="panel-ar" data-panel="ar"></section>
      <section class="panel is-hidden" id="panel-squad" data-panel="squad"></section>
      <section class="panel is-hidden" id="panel-missions" data-panel="missions"></section>
      <section class="panel is-hidden" id="panel-multiplayer" data-panel="multiplayer"></section>
      <section class="panel is-hidden" id="panel-miners" data-panel="miners"></section>
      <section class="panel is-hidden" id="panel-pending" data-panel="pending"></section>
      <section class="panel is-hidden" id="panel-handlers" data-panel="handlers"></section>
    </main>

    <!-- ── live event ticker (SSE) ─────────────────────────────────────── -->
    <aside class="ticker ent-glass" id="ticker" aria-live="polite" aria-label="live entropy stream">
      <header>
        <span class="dot" id="ticker-dot"></span>
        <b>LIVE STREAM</b>
        <button class="btn btn-ghost btn-xs" id="btn-clear-feed" type="button">clear</button>
      </header>
      <ul id="feed"></ul>
    </aside>

    <footer class="footbar">
      <span id="foot-alloy">chromium —</span>
      <span class="sep"></span>
      <span id="foot-genesis">genesis —</span>
      <span class="sep"></span>
      <span id="foot-handlers">handlers —</span>
      <span class="sep"></span>
      <span class="mono" id="foot-note">RLU is a content-accounting unit · not money · no market</span>
    </footer>

    <div class="toast-stack" id="toasts" aria-live="assertive"></div>
    <dialog id="modal" class="modal ent-glass">
      <form method="dialog" class="modal-body">
        <header><b id="modal-title">dialog</b><button class="btn btn-ghost btn-xs" value="cancel" type="submit">close</button></header>
        <div id="modal-content"></div>
      </form>
    </dialog>

    <script src="/ui/hud.js" defer></script>
  </body>
</html>
